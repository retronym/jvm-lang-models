name: API docs

# The doc-gen4 site for every library, Mathlib's imported modules included: about 10 minutes
# with a warm Mathlib cache and 300 MB of HTML, so it runs on demand (Actions → API docs → Run
# workflow) and publishes to GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Build the API docs
        working-directory: docbuild
        run: lake build All:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
