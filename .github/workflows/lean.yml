name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Workspace (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No theorem is proved by native_decide
        run: python3 -I scripts/lint_native_decide.py
      - name: Documents are cross-linked, and no link is broken
        run: python3 -I scripts/lint_links.py
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Core theorems use only the standard axioms
        run: python3 -I scripts/check_axioms.py
      - name: docs/stats.md is current
        run: python3 -I scripts/model_stats.py --check
      - name: docs/specification-ledger.md is current
        run: python3 -I scripts/spec_ledger.py --check

  standalone:
    name: Standalone ${{ matrix.package }}
    # The Mathlib-free packages, built on their own, as a consumer that requires one of them does.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [query, jvm, java, scala-types, scala, intellij]
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: packages/${{ matrix.package }}
          use-mathlib-cache: false
          build: true
          test: false
          lint: false

  mima-sound:
    name: MiMa.Sound (slow)
    # The corrected MiMa rules, checked by kernel `decide` over the edit space: about 35 minutes,
    # so only on demand (Actions → Lean → Run workflow), not on pushes or pull requests.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
      - run: lake build MiMa.Sound
