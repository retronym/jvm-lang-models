name = "jvm-lang-models"
version = "0.1.0"
defaultTargets = ["All"]

[[require]]
name = "query"
path = "packages/query"

[[require]]
name = "scala-types"
path = "packages/scala-types"

[[require]]
name = "jvm"
path = "packages/jvm"

[[require]]
name = "java"
path = "packages/java"

[[require]]
name = "scala"
path = "packages/scala"

[[require]]
name = "inc-comp"
path = "packages/inc-comp"

[[require]]
name = "zinc"
path = "packages/zinc"

[[require]]
name = "mima"
path = "packages/mima"

[[require]]
name = "links"
path = "packages/links"

[[require]]
name = "intellij"
path = "packages/intellij"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_exe]]
name = "exhaustive"
root = "Exhaustive"

[[lean_exe]]
name = "conformance"
root = "Conformance"

[[lean_exe]]
name = "jconformance"
root = "JConformance"

[[lean_exe]]
name = "jvmcases"
root = "JvmCases"

[[lean_exe]]
name = "scalaprobe"
root = "ScalaProbe"

[[lean_exe]]
name = "javaprobe"
root = "JavaProbe"

[[lean_exe]]
name = "bincompat"
root = "BinCompatMain"

[[lean_lib]]
name = "All"
