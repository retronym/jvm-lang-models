name = "zinc"
version = "0.1.0"
defaultTargets = ["All"]

[[require]]
name = "query"
path = "packages/query"

[[require]]
name = "scala-types"
path = "packages/scala-types"

[[require]]
name = "jvm"
path = "packages/jvm"

[[require]]
name = "java"
path = "packages/java"

[[require]]
name = "scala"
path = "packages/scala"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The name-resolution spaces, compiled to native code so that `native_decide` over them (in
# `Zinc.NamesRules`) does not run in the interpreter.
[[lean_lib]]
name = "ZincNames"
roots = ["ZincNames"]
precompileModules = true

[[lean_lib]]
name = "Zinc"

[[lean_exe]]
name = "exhaustive"
root = "Exhaustive"

[[lean_exe]]
name = "conformance"
root = "Conformance"

[[lean_exe]]
name = "jconformance"
root = "JConformance"

[[lean_exe]]
name = "jvmcases"
root = "JvmCases"

[[lean_exe]]
name = "scalaprobe"
root = "ScalaProbe"

[[lean_lib]]
name = "BinCompat"

[[lean_exe]]
name = "javaprobe"
root = "JavaProbe"

[[lean_exe]]
name = "bincompat"
root = "BinCompatMain"

[[lean_lib]]
name = "All"
